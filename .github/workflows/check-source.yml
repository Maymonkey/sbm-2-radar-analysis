name: Check and download Royal Rain radar images

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  
jobs:
  download-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Get latest radar image list
        run: |
          curl --fail --show-error --location \
            --connect-timeout 20 \
            --max-time 90 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 3 \
            "https://file.royalrain.go.th/opendata/radar_data/cappi/api.php?station=sattahip" \
            --output /tmp/radar-index.json

      - name: Download latest 10 images
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import subprocess
          import time
          from pathlib import Path
          from urllib.parse import urlparse

          with open("/tmp/radar-index.json", encoding="utf-8") as file:
              payload = json.load(file)

          if payload.get("rc") != 0:
              raise SystemExit(f"Radar API returned an error: {payload}")

          images = sorted(
              payload.get("data", []),
              key=lambda item: item.get("datetime_utc", ""),
              reverse=True,
          )[:10]

          if len(images) != 10:
              raise SystemExit(f"Expected 10 images, got {len(images)}")

          output_dir = Path("radar_images")
          output_dir.mkdir(exist_ok=True)

          def download(image):
              url = image.get("url")
              timestamp = image.get("datetime_bangkok", "unknown")

              if not url:
                  return False, timestamp, "Missing image URL"

              # The API currently returns HTTP image links. Use HTTPS for download.
              if url.startswith("http://"):
                  url = "https://" + url[len("http://"):]

              filename = Path(urlparse(url).path).name
              target = output_dir / filename

              for attempt in range(1, 4):
                  try:
                      result = subprocess.run(
                          [
                              "curl",
                              "--fail",
                              "--silent",
                              "--show-error",
                              "--location",
                              "--connect-timeout",
                              "20",
                              "--max-time",
                              "90",
                              "--output",
                              str(target),
                              url,
                          ],
                          capture_output=True,
                          text=True,
                          timeout=100,
                      )

                      is_png = False
                      if result.returncode == 0 and target.exists():
                          with target.open("rb") as image_file:
                              is_png = image_file.read(8) == b"\x89PNG\r\n\x1a\n"

                      if is_png:
                          return True, timestamp, filename

                      error = result.stderr.strip() or "Downloaded file is not a valid PNG"

                  except subprocess.TimeoutExpired:
                      error = "Download exceeded 100-second safety limit"

                  if target.exists():
                      target.unlink()

                  if attempt < 3:
                      time.sleep(3 * attempt)

              return False, timestamp, error

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              results = list(executor.map(download, images))

          for success, timestamp, detail in results:
              state = "OK" if success else "FAILED"
              print(f"{state} | {timestamp} | {detail}")

          failures = [result for result in results if not result[0]]
          if failures:
              raise SystemExit(f"{len(failures)} image(s) failed to download")

          print(f"Successfully downloaded {len(results)} PNG images.")
          PY
          
      - name: Inspect latest PNG pixel data
        run: |
          python -m pip install --disable-pip-version-check --timeout 60 --retries 3 Pillow

          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from PIL import Image

          files = sorted(Path("radar_images").glob("*.png"))
          if not files:
              raise SystemExit("No PNG images found")

          latest = files[-1]

          with Image.open(latest) as image:
              rgb_image = image.convert("RGB")
              colors = Counter(rgb_image.getdata())

              print(f"File: {latest.name}")
              print(f"Format: {image.format}")
              print(f"Dimensions: {image.width} x {image.height}")
              print(f"Original color mode: {image.mode}")
              print(f"Unique RGB colors: {len(colors)}")
              print("Most common RGB colors:")

              for color, count in colors.most_common(15):
                  print(f"  RGB {color}: {count} pixels")
          PY

      - name: Map dBZ thresholds to legend RGB
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          calibration_path = Path("config/legend_anchors.json")
          with calibration_path.open(encoding="utf-8") as file:
              calibration = json.load(file)

          files = sorted(Path("radar_images").glob("*.png"))
          if not files:
              raise SystemExit("No PNG images found")

          latest = files[-1]

          with Image.open(latest) as image:
              expected_size = (
                  calibration["image_size"]["width"],
                  calibration["image_size"]["height"],
              )

              if image.size != expected_size:
                  raise SystemExit(
                      f"Image size changed: got {image.size}, "
                      f"expected {expected_size}"
                  )

              rgb_image = image.convert("RGB")
              sample_x = calibration["legend"]["sample_x"]

              print(f"Legend sample from: {latest.name}")
              print("Threshold | Marker Y | Sample Y | Legend RGB")

              for anchor in calibration["thresholds"]:
                  marker_y = anchor["marker_y"]
                  sample_y = marker_y - 5

                  if not (0 <= sample_x < image.width):
                      raise SystemExit(f"Legend x-coordinate is invalid: {sample_x}")

                  if not (0 <= sample_y < image.height):
                      raise SystemExit(f"Legend y-coordinate is invalid: {sample_y}")

                  rgb = rgb_image.getpixel((sample_x, sample_y))
                  threshold = anchor["dbz_greater_than"]

                  print(
                      f"> {threshold:>2} dBZ | "
                      f"{marker_y:>3} | {sample_y:>3} | {rgb}"
                  )
          PY

      - name: Compare legend palette with map pixels
        run: |
          python - <<'PY'
          import math
          from pathlib import Path
          from PIL import Image

          files = sorted(Path("radar_images").glob("*.png"))
          if not files:
              raise SystemExit("No PNG images found")

          latest = files[-1]

          with Image.open(latest) as image:
              rgb_image = image.convert("RGB")

              # Build the complete palette from the legend color bar.
              x = 850
              palette_runs = []

              for y in range(76, 461):
                  rgb = rgb_image.getpixel((x, y))

                  if not palette_runs or palette_runs[-1]["rgb"] != rgb:
                      palette_runs.append({"rgb": rgb})
              palette = [run["rgb"] for run in palette_runs]

              # The map is on the left; the legend panel begins around x=802.
              map_pixels = rgb_image.crop((0, 0, 802, 800))
              colors = map_pixels.getcolors(maxcolors=1_000_000)

              if colors is None:
                  raise SystemExit("Too many unique colors to inspect")

          limits = (0, 10, 25, 50, 100)
          matched_pixels = {limit: 0 for limit in limits}
          closest_colors = []

          for count, rgb in colors:
              best_distance_squared = None
              best_palette_rgb = None

              for palette_rgb in palette:
                  distance_squared = sum(
                      (int(a) - int(b)) ** 2
                      for a, b in zip(rgb, palette_rgb)
                  )

                  if (
                      best_distance_squared is None
                      or distance_squared < best_distance_squared
                  ):
                      best_distance_squared = distance_squared
                      best_palette_rgb = palette_rgb

              distance = math.sqrt(best_distance_squared)

              for limit in limits:
                  if distance <= limit:
                      matched_pixels[limit] += count

              if distance <= 50:
                  closest_colors.append(
                      (count, rgb, best_palette_rgb, round(distance, 1))
                  )

          total_pixels = 802 * 800
          print(f"Image: {latest.name}")
          print(f"Legend color bands found: {len(palette)}")
          print(f"Map pixels checked: {total_pixels}")

          for limit in limits:
              count = matched_pixels[limit]
              percent = 100 * count / total_pixels
              print(
                  f"Pixels within RGB distance {limit}: "
                  f"{count} ({percent:.2f}%)"
              )

          print("Most frequent map colors close to the legend palette:")
          for count, rgb, nearest, distance in sorted(
              closest_colors, reverse=True
          )[:15]:
              print(
                  f"RGB {rgb} x {count} pixels -> "
                  f"nearest legend {nearest}, distance {distance}"
              )
          PY

      - name: Draw SBM-2 analysis area
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw

          config = json.loads(Path("config/legend_anchors.json").read_text())
          area = config["analysis_area"]

          images = sorted(Path("radar_images").glob("*.cappi.png"))
          if not images:
              raise SystemExit("No CAPPI images found in radar_images/")

          image_path = images[-1]
          image = Image.open(image_path).convert("RGB")
          draw = ImageDraw.Draw(image)

          cx, cy = area["sbm2_pixel_xy"]
          km_per_pixel = area["source_km_per_pixel"]
          radius_px = area["radius_km"] / km_per_pixel
          half_cell_px = area["target_cell_size_km"] / (2 * km_per_pixel)

          # วงสีชมพู: พื้นที่รอบ SBM-2 ระยะ 60 กม.
          draw.ellipse(
              (cx - radius_px, cy - radius_px, cx + radius_px, cy + radius_px),
              outline=(255, 0, 255),
              width=3,
          )

          # กรอบสีฟ้า: เซลล์ 5 × 5 กม. ตรงจุด SBM-2
          draw.rectangle(
              (cx - half_cell_px, cy - half_cell_px,
               cx + half_cell_px, cy + half_cell_px),
              outline=(0, 255, 255),
              width=3,
          )

          # กากบาทสีขาวแสดงจุดศูนย์กลางที่ตั้งไว้
          draw.line((cx - 8, cy, cx + 8, cy), fill=(255, 255, 255), width=2)
          draw.line((cx, cy - 8, cx, cy + 8), fill=(255, 255, 255), width=2)

          output = Path("radar_images/diagnostic-area.png")
          image.save(output)
          print(f"Input: {image_path}")
          print(f"SBM-2 pixel: ({cx}, {cy})")
          print(f"100 km radius: {radius_px:.1f} pixels")
          print(f"5 km cell: {2 * half_cell_px:.1f} pixels wide")
          print(f"Saved: {output}")
          PY

      - name: Check CAPPI color trend across latest 10 images
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw

          config = json.loads(Path("config/legend_anchors.json").read_text())
          area = config["analysis_area"]

          images = sorted(Path("radar_images").glob("*.cappi.png"))[-10:]
          if not images:
              raise SystemExit("No CAPPI images found")

          palette = {
              (255,255,255), (0,0,255), (0,1,255), (0,3,255),
              (0,25,255), (0,51,255), (0,102,255), (0,153,255),
              (0,204,255), (255,0,255), (255,51,255), (255,153,255),
              (255,156,255), (255,179,255), (255,204,255), (255,0,0),
              (255,33,0), (255,51,0), (255,105,0), (255,123,0),
              (255,138,0), (255,139,0), (255,143,0), (255,176,0),
              (255,199,0), (255,214,0), (255,255,0), (247,245,0),
              (232,247,59), (71,255,0), (68,255,0), (51,255,0),
              (0,224,20), (0,204,51), (0,176,71), (0,125,79),
              (0,102,79)
          }

          cx, cy = area["sbm2_pixel_xy"]
          km_per_pixel = area["source_km_per_pixel"]
          radius_px = area["radius_km"] / km_per_pixel
          half_cell_px = area["target_cell_size_km"] / (2 * km_per_pixel)

          # สร้างตำแหน่งพิกเซลในวง 60 กม. และนับเซลล์ SBM-2 แยก
          points = []
          for y in range(800):
              for x in range(802):
                  if (x-cx)**2 + (y-cy)**2 <= radius_px**2:
                      in_cell = (
                          abs(x-cx) <= half_cell_px
                          and abs(y-cy) <= half_cell_px
                      )
                      points.append((x, y, in_cell))

          circle_total = len(points)
          cell_total = sum(in_cell for _, _, in_cell in points)
          rows = []
          latest_overlay = None

          for image_path in images:
              image = Image.open(image_path).convert("RGB")
              if image.size != (1076, 800):
                  raise SystemExit(
                      f"Unexpected image size in {image_path.name}: {image.size}"
                  )

              pixels = image.load()
              circle_hits = 0
              cell_hits = 0
              hits = []

              for x, y, in_cell in points:
                  if pixels[x, y] in palette:
                      circle_hits += 1
                      hits.append((x, y))
                      if in_cell:
                          cell_hits += 1

              row = {
                  "file": image_path.name,
                  "circle_matches": circle_hits,
                  "circle_pixels": circle_total,
                  "circle_percent": round(100 * circle_hits / circle_total, 2),
                  "cell_matches": cell_hits,
                  "cell_pixels": cell_total,
                  "cell_percent": round(100 * cell_hits / cell_total, 2),
              }
              rows.append(row)

              if image_path == images[-1]:
                  latest_overlay = (image.copy(), hits)

          csv_path = Path("radar_images/palette-timeseries.csv")
          with csv_path.open("w", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=rows[0].keys())
              writer.writeheader()
              writer.writerows(rows)

          print(f"File | {area['radius_km']}-km palette % | SBM-2 cell palette %")
          for row in rows:
              print(
                  f"{row['file']} | {row['circle_percent']}% "
                  f"({row['circle_matches']}/{row['circle_pixels']}) | "
                  f"{row['cell_percent']}% "
                  f"({row['cell_matches']}/{row['cell_pixels']})"
              )

          image, hits = latest_overlay
          marked = image.convert("RGBA")
          overlay = Image.new("RGBA", marked.size, (0, 0, 0, 0))
          draw = ImageDraw.Draw(overlay)
          for x, y in hits:
              draw.point((x, y), fill=(255, 0, 255, 180))

          marked = Image.alpha_composite(marked, overlay).convert("RGB")
          draw = ImageDraw.Draw(marked)
          draw.ellipse(
              (cx-radius_px, cy-radius_px, cx+radius_px, cy+radius_px),
              outline=(255, 0, 255), width=2
          )
          draw.rectangle(
              (cx-half_cell_px, cy-half_cell_px,
               cx+half_cell_px, cy+half_cell_px),
              outline=(0, 255, 255), width=2
          )
          marked.save("radar_images/diagnostic-palette.png")
          print(f"Saved {csv_path} and latest-frame diagnostic image")
          PY
          
      - name: Estimate and locate dBZ echoes around SBM-2
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          import statistics
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from PIL import Image

          # ตัวอย่างสีใน legend และค่า dBZ ที่อ่านจาก marker
          # ค่าระหว่าง marker เป็นค่าประมาณจาก interpolation
          ANCHORS = [
              (81, 72), (101, 70), (121, 68), (140, 64), (160, 60),
              (180, 56), (200, 54), (219, 50), (239, 48), (259, 42),
              (278, 40), (298, 36), (318, 34), (338, 28), (357, 26),
              (377, 22), (397, 20), (416, 16), (436, 12), (456, 8),
          ]

          LEGEND_X = 850
          MAP_RIGHT = 802
          LEGEND_TOP = 76
          LEGEND_BOTTOM = 460
          DBZ_THRESHOLD = 20
          MIN_COMPONENT_PIXELS = 5
          ICT = timezone(timedelta(hours=7))


          def get_latest_images():
              images = sorted(Path("radar_images").glob("*.cappi.png"))[-10:]
              if not images:
                  raise SystemExit("No CAPPI images found")
              return images


          def get_frame_times(image_path):
              """ชื่อไฟล์ใช้ UTC; คืนเวลา UTC และ ICT"""
              utc_time = datetime.strptime(
                  image_path.name[:12], "%Y%m%d%H%M"
              ).replace(tzinfo=timezone.utc)

              ict_time = utc_time.astimezone(ICT)
              return utc_time, ict_time


          def estimate_dbz_from_legend_y(y):
              if y <= ANCHORS[0][0]:
                  return float(ANCHORS[0][1])

              if y >= ANCHORS[-1][0]:
                  return float(ANCHORS[-1][1])

              for (y1, dbz1), (y2, dbz2) in zip(ANCHORS, ANCHORS[1:]):
                  if y1 <= y <= y2:
                      fraction = (y - y1) / (y2 - y1)
                      return dbz1 + fraction * (dbz2 - dbz1)

              return None


          def build_color_to_dbz(reference_image_path):
              """อ่านสีของแต่ละแถบใน legend แล้วประมาณค่า dBZ"""
              image = Image.open(reference_image_path).convert("RGB")

              if image.width <= LEGEND_X or image.height <= LEGEND_BOTTOM:
                  raise SystemExit(f"Unexpected image size: {image.size}")

              color_rows = {}
              for y in range(LEGEND_TOP, LEGEND_BOTTOM + 1):
                  color = image.getpixel((LEGEND_X, y))
                  color_rows.setdefault(color, []).append(y)

              return {
                  color: estimate_dbz_from_legend_y(statistics.median(rows))
                  for color, rows in color_rows.items()
              }


          def make_analysis_points(width, height, center_x, center_y,
                                   radius_px, half_cell_px):
              """เลือกพิกเซลในวงวิเคราะห์ และทำเครื่องหมายเซลล์ SBM-2"""
              points = []

              for y in range(height):
                  for x in range(min(MAP_RIGHT, width)):
                      distance_squared = (
                          (x - center_x) ** 2 + (y - center_y) ** 2
                      )
                      if distance_squared > radius_px ** 2:
                          continue

                      in_cell = (
                          abs(x - center_x) <= half_cell_px
                          and abs(y - center_y) <= half_cell_px
                      )
                      points.append((x, y, in_cell))

              return points


          def find_province_label_mask(images, points, color_to_dbz):
              """
              หาตำแหน่ง >=35 dBZ ที่ปรากฏทุกภาพ
              ใช้เป็น mask ตัดตัวหนังสือชื่อจังหวัดตามที่ตรวจจากภาพ
              """
              frame_masks = []

              for image_path in images:
                  image = Image.open(image_path).convert("RGB")
                  pixels = image.load()
                  mask = set()

                  for x, y, _ in points:
                      dbz = color_to_dbz.get(pixels[x, y])
                      if dbz is not None and dbz >= 35:
                          mask.add((x, y))

                  frame_masks.append(mask)

              return set.intersection(*frame_masks) if frame_masks else set()


          def find_echo_components(candidate_dbz):
              """แบ่งพิกเซลที่ถึงเกณฑ์เป็นกลุ่มที่ติดกัน 8 ทิศ"""
              remaining = set(candidate_dbz)
              components = []

              while remaining:
                  seed = remaining.pop()
                  stack = [seed]
                  pixels = [seed]

                  while stack:
                      x, y = stack.pop()

                      for ny in range(y - 1, y + 2):
                          for nx in range(x - 1, x + 2):
                              point = (nx, ny)
                              if point in remaining:
                                  remaining.remove(point)
                                  stack.append(point)
                                  pixels.append(point)

                  if len(pixels) < MIN_COMPONENT_PIXELS:
                      continue

                  values = [candidate_dbz[p] for p in pixels]
                  components.append({
                      "pixels": pixels,
                      "pixel_count": len(pixels),
                      "max_dbz": max(values),
                      "mean_dbz": sum(values) / len(values),
                  })

              return components


          def bearing_from_center(dx_east_km, dy_north_km):
              """คำนวณ bearing จากทิศเหนือ ตามเข็มนาฬิกา"""
              bearing = math.degrees(
                  math.atan2(dx_east_km, dy_north_km)
              ) % 360

              compass = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"]
              direction = compass[int((bearing + 22.5) // 45) % 8]
              return bearing, direction


          def analyze_frame(image_path, points, label_mask, color_to_dbz,
                            area, center_x, center_y, km_per_pixel):
              image = Image.open(image_path).convert("RGB")
              pixels = image.load()

              circle_total = 0
              cell_total = 0
              circle_ge20 = 0
              circle_ge35 = 0
              cell_ge20 = 0
              cell_ge35 = 0
              cell_dbz = []
              candidate_dbz = {}

              for x, y, in_cell in points:
                  # ข้ามพิกเซลตัวหนังสือจังหวัดที่พบตำแหน่งคงที่
                  if (x, y) in label_mask:
                      continue

                  circle_total += 1
                  if in_cell:
                      cell_total += 1

                  dbz = color_to_dbz.get(pixels[x, y])
                  if dbz is None:
                      continue

                  if dbz >= DBZ_THRESHOLD:
                      circle_ge20 += 1
                      candidate_dbz[(x, y)] = dbz
                      if in_cell:
                          cell_ge20 += 1

                  if dbz >= 35:
                      circle_ge35 += 1
                      if in_cell:
                          cell_ge35 += 1

                  if in_cell:
                      cell_dbz.append(dbz)

              components = find_echo_components(candidate_dbz)

              component_rows = []
              for component in components:
                  xs = [x for x, _ in component["pixels"]]
                  ys = [y for _, y in component["pixels"]]
                  centroid_x = sum(xs) / len(xs)
                  centroid_y = sum(ys) / len(ys)

                  dx_east_km = (centroid_x - center_x) * km_per_pixel
                  dy_north_km = (center_y - centroid_y) * km_per_pixel
                  distance_km = math.hypot(dx_east_km, dy_north_km)
                  bearing, direction = bearing_from_center(
                      dx_east_km, dy_north_km
                  )

                  component_rows.append({
                      "file": image_path.name,
                      "time_utc": get_frame_times(image_path)[0].isoformat(),
                      "time_ict": get_frame_times(image_path)[1].isoformat(),
                      "pixel_count": component["pixel_count"],
                      "area_km2_approx": round(
                          component["pixel_count"] * km_per_pixel ** 2, 2
                      ),
                      "centroid_x": round(centroid_x, 1),
                      "centroid_y": round(centroid_y, 1),
                      "distance_from_sbm2_km": round(distance_km, 1),
                      "bearing_from_sbm2_deg": round(bearing, 1),
                      "direction_from_sbm2": direction,
                      "max_estimated_dbz": round(component["max_dbz"], 1),
                      "mean_estimated_dbz": round(component["mean_dbz"], 1),
                  })

              component_rows.sort(
                  key=lambda row: row["distance_from_sbm2_km"]
              )
              for index, row in enumerate(component_rows, start=1):
                  row["nearest_component_rank"] = index

              summary = {
                  "file": image_path.name,
                  "time_utc": get_frame_times(image_path)[0].isoformat(),
                  "time_ict": get_frame_times(image_path)[1].isoformat(),
                  "radius_km": area["radius_km"],
                  "circle_pixels": circle_total,
                  "circle_ge20_pixels": circle_ge20,
                  "circle_ge20_percent": round(
                      100 * circle_ge20 / circle_total, 2
                  ) if circle_total else 0,
                  "circle_ge35_pixels": circle_ge35,
                  "cell_pixels": cell_total,
                  "cell_ge20_pixels": cell_ge20,
                  "cell_ge20_percent": round(
                      100 * cell_ge20 / cell_total, 2
                  ) if cell_total else 0,
                  "cell_ge35_pixels": cell_ge35,
                  "cell_max_estimated_dbz": (
                      round(max(cell_dbz), 1) if cell_dbz else ""
                  ),
                  "components_ge20_min5pixels": len(component_rows),
                  "nearest_component_distance_km": (
                      component_rows[0]["distance_from_sbm2_km"]
                      if component_rows else ""
                  ),
                  "nearest_component_direction": (
                      component_rows[0]["direction_from_sbm2"]
                      if component_rows else ""
                  ),
              }

              return summary, component_rows


          def write_csv(path, rows):
              if not rows:
                  path.write_text("")
                  return

              with path.open("w", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=rows[0].keys())
                  writer.writeheader()
                  writer.writerows(rows)


          def main():
              images = get_latest_images()
              config = json.loads(
                  Path("config/legend_anchors.json").read_text()
              )
              area = config["analysis_area"]

              center_x, center_y = area["sbm2_pixel_xy"]
              km_per_pixel = area["source_km_per_pixel"]
              radius_px = area["radius_km"] / km_per_pixel
              half_cell_px = (
                  area["target_cell_size_km"] / (2 * km_per_pixel)
              )

              reference = Image.open(images[-1]).convert("RGB")
              width, height = reference.size
              color_to_dbz = build_color_to_dbz(images[-1])

              points = make_analysis_points(
                  width,
                  height,
                  center_x,
                  center_y,
                  radius_px,
                  half_cell_px,
              )

              label_mask = find_province_label_mask(
                  images, points, color_to_dbz
              )
              print(
                  "Excluded stable province-label pixels: "
                  f"{len(label_mask)}"
              )
              print("Filename times are UTC; reported times are ICT (UTC+07:00).")
              print(
                  f"Component threshold: >= {DBZ_THRESHOLD} dBZ, "
                  f"minimum {MIN_COMPONENT_PIXELS} connected pixels."
              )

              summary_rows = []
              component_rows = []

              for image_path in images:
                  summary, frame_components = analyze_frame(
                      image_path,
                      points,
                      label_mask,
                      color_to_dbz,
                      area,
                      center_x,
                      center_y,
                      km_per_pixel,
                  )
                  summary_rows.append(summary)
                  component_rows.extend(frame_components)

              summary_path = Path("radar_images/dbz-timeseries.csv")
              components_path = Path("radar_images/echo-components.csv")
              write_csv(summary_path, summary_rows)
              write_csv(components_path, component_rows)

              print(
                  "Time ICT | Cell >=20 | Max dBZ | "
                  "Echo groups | Nearest group km / direction"
              )
              for row in summary_rows:
                  nearest = (
                      f"{row['nearest_component_distance_km']} km / "
                      f"{row['nearest_component_direction']}"
                      if row["nearest_component_distance_km"] != ""
                      else "none"
                  )
                  print(
                      f"{row['time_ict']} | "
                      f"{row['cell_ge20_pixels']}/{row['cell_pixels']} "
                      f"({row['cell_ge20_percent']}%) | "
                      f"{row['cell_max_estimated_dbz']} | "
                      f"{row['components_ge20_min5pixels']} | "
                      f"{nearest}"
                  )

              print(f"Saved: {summary_path}")
              print(f"Saved: {components_path}")


          main()
          PY
      
      - name: Save images as a temporary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sattahip-radar-latest-10
          path: radar_images/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          
      - name: Delete older radar image artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "sattahip-radar-latest-10") | "\(.id)\t\(.workflow_run.id)"' \
            | while IFS=$'\t' read -r artifact_id run_id; do
                if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
                  gh api --method DELETE \
                    "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
                  echo "Deleted previous artifact: ${artifact_id}"
                fi
              done
