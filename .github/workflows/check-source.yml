name: Check and download Royal Rain radar images

on:
  workflow_dispatch:
    inputs:
      continue_refresh:
        description: Continue the six-minute refresh chain (normally leave disabled)
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/check-source.yml'

permissions:
  contents: read

concurrency:
  group: radar-pipeline-${{ github.repository }}
  cancel-in-progress: false

jobs:
  download-images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --timeout 60 --retries 3 -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Restore previous radar images and track IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/artifact_store.py restore
      - name: Download and validate the latest available scans
        run: python scripts/download_radar.py
      - name: Analyse echo shapes and export track history
        run: python scripts/analyze_radar.py
      - name: Stage the single-file API response
        run: |
          mkdir -p public/api
          cp radar_images/latest-status.json public/api/latest-status.json
      - name: Save validated radar bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sattahip-radar-latest-10-${{ github.run_id }}-${{ github.run_attempt }}
          path: radar_images/
          if-no-files-found: error
          retention-days: 2
      - name: Upload GitHub Pages API bundle
        if: vars.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public/
      - name: Delete older radar bundles after upload succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: python scripts/artifact_store.py prune

  publish-public-api:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    needs: download-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the latest JSON API
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  continue-six-minute-refresh:
    # Continue only after a successful radar analysis. Pages is optional and may be skipped.
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.continue_refresh) &&
      needs.download-images.result == 'success' &&
      (needs.publish-public-api.result == 'success' || needs.publish-public-api.result == 'skipped')
    needs: [download-images, publish-public-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Dispatch the next refresh at the next six-minute ICT slot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timedelta, timezone
          from urllib.request import Request, urlopen

          now = datetime.now(timezone.utc)
          slot = now.replace(second=0, microsecond=0)
          while slot <= now or slot.minute % 6 != 2:
              slot += timedelta(minutes=1)

          print(f"Current UTC time: {now.isoformat()}")
          print(f"Next refresh slot: {slot.isoformat()} (ICT {slot + timedelta(hours=7):%Y-%m-%d %H:%M:%S})")
          while True:
              remaining = (slot - datetime.now(timezone.utc)).total_seconds()
              if remaining <= 0:
                  break
              time.sleep(min(30, remaining))

          repository = os.environ["GH_REPOSITORY"]
          endpoint = f"https://api.github.com/repos/{repository}/actions/workflows/check-source.yml/dispatches"
          payload = json.dumps({
              "ref": "main",
              "inputs": {"continue_refresh": "true"},
          }).encode()
          request = Request(
              endpoint,
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "sbm-2-radar-analysis",
              },
          )
          with urlopen(request, timeout=60) as response:
              if response.status != 204:
                  raise RuntimeError(f"Workflow dispatch failed: HTTP {response.status}")
              print("Next refresh dispatched successfully (HTTP 204).")
          PY
