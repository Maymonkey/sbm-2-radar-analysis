name: Check and download Royal Rain radar images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/check-source.yml'

permissions:
  contents: read

concurrency:
  group: radar-pipeline-${{ github.repository }}
  cancel-in-progress: false

jobs:
  download-images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --timeout 60 --retries 3 -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Restore previous radar images and track IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/artifact_store.py restore
      - name: Download and validate the latest available scans
        run: python scripts/download_radar.py
      - name: Analyse echo shapes and export track history
        run: python scripts/analyze_radar.py
      - name: Save validated radar bundle
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sattahip-radar-latest-10-${{ github.run_id }}-${{ github.run_attempt }}
          path: radar_images/
          if-no-files-found: error
          retention-days: 2
      - name: Delete older radar bundles after upload succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: python scripts/artifact_store.py prune
