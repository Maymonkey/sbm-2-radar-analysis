name: Recover stopped radar refresh

on:
  schedule:
    - cron: '2,8,14,20,26,32,38,44,50,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: radar-refresh-recovery-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Recover stopped or stalled radar refreshes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/refresh_radar.py recover
